<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Netorax Key System</title>

<style>
*{
  box-sizing:border-box;
}

html,body{
  width:100%;
  min-height:100%;
}

body{
  margin:0;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:#080c18;
  color:#fff;
  font-family:Arial,sans-serif;
  overflow-x:hidden;
}

.card{
  width:100%;
  max-width:440px;
  padding:30px;
  border-radius:20px;
  background:#12182a;
  border:1px solid #273454;
  box-shadow:0 25px 70px #0009;
  text-align:center;
  overflow:hidden;
}

/* LOGO 80x80 */
.logo{
  width:80px;
  height:80px;
  margin:0 auto 18px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:18px;
  overflow:hidden;
  background:#1c2640;
}

.logo img{
  width:100%;
  height:100%;
  display:block;
  object-fit:contain;
  border-radius:18px;
}

h1{
  margin:0;
  font-size:27px;
  line-height:1.2;
  overflow-wrap:anywhere;
}

.sub{
  margin-top:9px;
  color:#9da9c3;
  font-size:14px;
  line-height:1.5;
  overflow-wrap:anywhere;
}

.status{
  margin:22px 0 16px;
  padding:12px;
  border-radius:10px;
  background:#1c2640;
  color:#cdd8f3;
  font-size:14px;
  line-height:1.4;
  overflow-wrap:anywhere;
}

button{
  width:100%;
  padding:14px;
  border:0;
  border-radius:11px;
  background:#4f7cff;
  color:#fff;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
  transition:.2s;
}

button:hover{
  filter:brightness(1.12);
  transform:translateY(-1px);
}

button:active{
  transform:translateY(0);
}

button:disabled{
  opacity:.6;
  cursor:not-allowed;
  transform:none;
}

.keyBox{
  display:none;
  margin-top:18px;
  padding:18px;
  border-radius:12px;
  background:#0b1121;
  border:1px solid #33446f;
  overflow:hidden;
}

.keyLabel{
  color:#8996b2;
  font-size:12px;
  margin-bottom:9px;
}

.key{
  max-width:100%;
  font-size:26px;
  font-weight:bold;
  letter-spacing:3px;
  line-height:1.3;
  overflow-wrap:anywhere;
  word-break:break-word;
}

.copy{
  margin-top:13px;
  background:#252f49;
  font-size:14px;
}

.small{
  margin-top:20px;
  color:#71809d;
  font-size:12px;
  line-height:1.4;
  overflow-wrap:anywhere;
}

@media(max-width:400px){
  .card{
    padding:24px 18px;
  }

  h1{
    font-size:24px;
  }

  .key{
    font-size:22px;
  }
}
</style>
</head>

<body>

<div class="card">

  <div class="logo">
    <img src="./hinh-anh.png" alt="">
  </div>

  <h1>Netorax Key System</h1>

  <div class="sub">
    Get your key to continue
  </div>

  <div id="status" class="status">
    Sẵn sàng nhận Key
  </div>

  <button id="btn" onclick="getKey()">
    GET KEY
  </button>

  <div id="keyBox" class="keyBox">

    <div class="keyLabel">
      KEY CỦA BẠN
    </div>

    <div id="key" class="key"></div>

    <button class="copy" onclick="copyKey()">
      COPY KEY
    </button>

  </div>

  <div class="small">
    Netorax Key System
  </div>

</div>

<script>
let currentKey="";

async function getKey(){

  const btn=document.getElementById("btn");
  const status=document.getElementById("status");
  const box=document.getElementById("keyBox");
  const key=document.getElementById("key");

  btn.disabled=true;
  status.textContent="Đang lấy Key...";
  box.style.display="none";

  try{

    const response=await fetch("/api/getkey");
    const data=await response.json();

    if(data.success){

      currentKey=String(data.key);

      key.textContent=currentKey;
      box.style.display="block";

      status.textContent="Lấy Key thành công!";

    }else{

      status.textContent=
        data.message || "Không thể lấy Key.";

    }

  }catch(error){

    status.textContent=
      "Không kết nối được API.";

  }

  btn.disabled=false;
}

async function copyKey(){

  if(!currentKey) return;

  try{

    await navigator.clipboard.writeText(currentKey);

    document.getElementById("status").textContent=
      "Đã copy Key!";

  }catch(error){

    document.getElementById("status").textContent=
      "Không thể copy tự động.";

  }

}
</script>

</body>
</html>
