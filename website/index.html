<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Netorax Key System</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0b1020;color:#fff;font-family:Arial,sans-serif}
.card{width:min(420px,92vw);padding:28px;border-radius:18px;background:#151c32;box-shadow:0 20px 60px #0008;text-align:center}
h1{margin:0 0 8px}.sub{color:#aeb8d0;margin-bottom:24px}.status{padding:12px;border-radius:10px;background:#202a46;margin:15px 0;color:#dce5ff}
button{width:100%;padding:13px;border:0;border-radius:10px;background:#4f7cff;color:white;font-size:16px;font-weight:bold;cursor:pointer}
button:hover{filter:brightness(1.1)}button:disabled{opacity:.6;cursor:not-allowed}
.key{margin-top:18px;padding:16px;border-radius:10px;background:#0d1428;border:1px solid #33446f;font-size:24px;font-weight:bold;letter-spacing:2px}
.small{font-size:12px;color:#8e9ab5;margin-top:18px}
</style>
</head>
<body>
<div class="card">
  <h1>Netorax Key System</h1>
  <div class="sub">Demo Link4M → Get Key → Verify API</div>
  <div id="status" class="status">Đang kiểm tra...</div>
  <button id="btn" onclick="getKey()">GET KEY</button>
  <div id="keyBox" class="key" style="display:none"></div>
  <div class="small">Demo hiện dùng Key: 1. Bước Link4M chỉ là mô phỏng.</div>
</div>
<script>
async function getKey(){
  const btn=document.getElementById('btn'), status=document.getElementById('status'), box=document.getElementById('keyBox');
  btn.disabled=true; status.textContent='Đang xác nhận...'; box.style.display='none';
  try{
    const r=await fetch('/api/getkey');
    const d=await r.json();
    if(d.success){status.textContent='Xác nhận thành công!';box.textContent=d.key;box.style.display='block';}
    else status.textContent=d.message||'Không thể lấy Key.';
  }catch(e){status.textContent='Không kết nối được API. Hãy xem README.'}
  btn.disabled=false;
}
getKey();
</script>
</body>
</html>
